# Runs the gate (scripts/check.sh: format lint, build, fast tests, app build) on every pull request and on main.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Apple silicon, macOS 26, Xcode 26.6, like the release.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # swift build's folder, and the app build's packages, products and module cache (not its index)
      BUILD_CACHE: |
        Packages/TaellmiKit/.build
        build/SourcePackages
        build/Build
        build/ModuleCache.noindex
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Xcode 26.6, the Metal toolchain, xcodegen and the German language data the tests need.
      - name: toolchain
        run: scripts/ci-setup.sh

      # Both builds compile every dependency (MLX and friends take most of the time) from scratch on a fresh runner.
      # Reuse them: only main saves (about 6 GB of a 10 GB repo quota), every run restores, and a pull request reads
      # main's. The key changes with the dependencies, so the cache is saved again only then.
      - name: restore built dependencies
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_CACHE }}
          key: check-build-macos26-xcode26.6-${{ hashFiles('Packages/TaellmiKit/Package.resolved', 'Packages/TaellmiKit/Package.swift', 'project.yml') }}
          restore-keys: check-build-macos26-xcode26.6-

      - name: check
        run: scripts/check.sh

      - name: save built dependencies
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_CACHE }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
