# Builds tällmi and publishes it as a GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# A tag with a hyphen (v0.2.0-beta.1) becomes a pre-release. To rebuild an existing tag, run the workflow
# by hand with that tag; it replaces the release's files.
# The app is signed with Developer ID and notarized by Apple, so it opens without a warning (ADR 0016).
# It needs the secrets listed in docs/decisions/0016-signed-and-notarized.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  # to see whether the check workflow already passed on the tagged commit
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Apple silicon, macOS 26, Xcode 26.6 (the app is Apple silicon only).
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # FormuFix GmbH; public anyway, it is in every app the team signs.
      TEAM_ID: 284CCFBH2H
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          # The build runs third-party package code; it gets no git credentials (gh uses GH_TOKEN).
          persist-credentials: false

      # Xcode 26.6, the Metal toolchain, xcodegen and the German language data the tests need.
      - name: toolchain
        run: scripts/ci-setup.sh

      - name: version from tag
        run: |
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "✘ tag $TAG is not v<major>.<minor>.<patch>"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The gate (format lint, build, fast tests, app build) already ran on main for a commit tagged there.
      # Run it here only when this exact commit has no passing check run, e.g. a tag off main.
      - name: checked already?
        id: checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          PASSED=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')
          if [[ "$PASSED" -gt 0 ]]; then
            echo "✔ check passed on $SHA already; not running it again"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "▸ no passing check on $SHA; running it here"
          fi

      - name: check
        if: steps.checked.outputs.passed != 'true'
        run: scripts/check.sh

      # Built without the signing key: the build runs third-party package code, so the key arrives only afterwards.
      - name: build
        run: |
          xcodegen generate --quiet
          # Apple silicon only, and the app's version is numbers only (v0.2.0-beta.1 → 0.2.0).
          xcodebuild -project Taellmi.xcodeproj -scheme Taellmi -configuration Release \
            -derivedDataPath build/release -skipPackagePluginValidation -skipMacroValidation ARCHS=arm64 \
            MARKETING_VERSION="${VERSION%%-*}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build > build/xcodebuild-release.log 2>&1 \
            || { grep -E "error:" build/xcodebuild-release.log | head -40; exit 1; }

      # The Developer ID certificate goes into a keychain of its own, which the last step deletes.
      - name: signing keychain
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          [[ -n "$CERT_P12" && -n "$CERT_PASSWORD" ]] \
            || { echo "✘ secrets DEVELOPER_ID_CERT_P12 and DEVELOPER_ID_CERT_PASSWORD are missing (ADR 0016)"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          base64 --decode <<<"$CERT_P12" > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -v team="($TEAM_ID)" '/"Developer ID Application: / && index($0, team) {print $2; exit}')
          [[ -n "$IDENTITY" ]] || { echo "✘ no Developer ID Application certificate for team $TEAM_ID in the secret"; exit 1; }
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Inside out: nested code first, the app last. Hardened runtime and a secure timestamp, as notarization requires.
      - name: sign
        run: |
          APP=build/release/Build/Products/Release/taellmi.app
          SIGN=(codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" --sign "$IDENTITY")
          while IFS= read -r -d '' item; do
            "${SIGN[@]}" "$item"
          done < <(find "$APP/Contents" -depth \( -name "*.framework" -o -name "*.dylib" -o -name "*.xpc" \
            -o -name "*.appex" -o -name "*.app" \) -print0)
          "${SIGN[@]}" --entitlements App/taellmi.entitlements "$APP"

      # Rule 1 of AGENTS.md: no outgoing network. Refuse to ship an app that could open connections.
      - name: verify
        run: |
          APP=build/release/Build/Products/Release/taellmi.app
          codesign --verify --deep --strict "$APP"
          SIGNATURE=$(codesign -dvv "$APP" 2>&1)
          grep -q "^TeamIdentifier=$TEAM_ID$" <<<"$SIGNATURE" || { echo "✘ the app is not signed by team $TEAM_ID"; exit 1; }
          grep -q "^Authority=Developer ID Application: " <<<"$SIGNATURE" || { echo "✘ the app is not signed with Developer ID"; exit 1; }
          grep -Eq "flags=.*\(runtime\)" <<<"$SIGNATURE" || { echo "✘ the app lacks the hardened runtime"; exit 1; }
          [[ "$(lipo -archs "$APP/Contents/MacOS/taellmi")" == "arm64" ]] || { echo "✘ the app is not Apple silicon only"; exit 1; }
          ENTITLEMENTS=$(codesign -d --entitlements - --xml "$APP" 2>/dev/null)
          if grep -q "com.apple.security.network.client" <<<"$ENTITLEMENTS"; then
            echo "✘ the app has the network-client entitlement"; exit 1
          fi
          grep -q "com.apple.security.app-sandbox" <<<"$ENTITLEMENTS" || { echo "✘ the app is not sandboxed"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      # The disk image opens on the app beside a link to Applications to drag it onto, with tällmi's licence and
      # the licences of the code built into it.
      - name: package
        run: |
          # One name for every version, so releases/latest/download/taellmi.dmg always gets the newest (the website links it).
          DIR="taellmi-$VERSION"; DMG="taellmi.dmg"
          mkdir "$DIR"
          # Finder shows the file name, so the app is "tällmi" there; taellmi stays in the bundle id and paths.
          ditto "$APP" "$DIR/tällmi.app"
          ln -s /Applications "$DIR/Applications"
          cp LICENSE "$DIR/LICENSE.txt"
          {
            echo "tällmi includes the following third-party code. Their licences follow."
            for f in Packages/TaellmiKit/Sources/CSQLiteVec/LICENSE* \
              build/release/SourcePackages/checkouts/*/{LICENSE,LICENCE,NOTICE,COPYING}*; do
              [[ -f "$f" ]] || continue
              name="${f#build/release/SourcePackages/checkouts/}"
              [[ "$f" == Packages/* ]] && name="sqlite-vec/$(basename "$f")"
              printf '\n\n==== %s ====\n\n' "$name"
              cat "$f"
            done
            printf '\n\n==== Funnel Display, Funnel Sans (fonts) ====\n\n'
            cat App/Fonts/OFL.txt
          } > "$DIR/THIRD_PARTY_NOTICES.txt"
          grep "^==== " "$DIR/THIRD_PARTY_NOTICES.txt"
          # hdiutil on a fresh runner sometimes fails with "Resource busy"; a retry gets past it.
          for attempt in 1 2 3; do
            hdiutil create -volname "tällmi $VERSION" -srcfolder "$DIR" -fs APFS -format UDZO -ov "$DMG" && break
            [[ $attempt == 3 ]] && exit 1
            sleep 10
          done
          hdiutil verify "$DMG"
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      # Apple checks the disk image and the app in it; the ticket is stapled on so it also opens offline.
      # This uploads the disk image to Apple from the runner; the app itself never goes online.
      - name: notarize
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          [[ -n "$NOTARY_KEY" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER_ID" ]] \
            || { echo "✘ secrets NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER_ID are missing (ADR 0016)"; exit 1; }
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_KEY" > "$KEY"
          AUTH=(--key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          RESULT=$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 45m --output-format json) || true
          echo "$RESULT"
          if [[ "$(jq -r '.status // empty' <<<"$RESULT")" != "Accepted" ]]; then
            ID=$(jq -r '.id // empty' <<<"$RESULT")
            [[ -n "$ID" ]] && xcrun notarytool log "$ID" "${AUTH[@]}"
            rm "$KEY"
            echo "✘ Apple did not accept the disk image"; exit 1
          fi
          rm "$KEY"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          # the checksum of the file people download, ticket included
          shasum -a 256 "$DMG" > "$DMG.sha256"
          cat "$DMG.sha256"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          tällmi $VERSION, for a mac with apple silicon and macOS 26.

          **install**

          download \`$DMG\` and open it. drag **tällmi** onto the Applications folder beside it. it is signed and notarized by Apple, so it opens like any other app.

          **models**

          speech and search by meaning run on models you download once, in a step you start yourself:

          \`\`\`bash
          brew install jq
          git clone --depth 1 --branch $TAG https://github.com/$GITHUB_REPOSITORY.git taellmi && cd taellmi
          scripts/download-model.sh parakeet-tdt-0.6b-v3       # speech
          scripts/download-model.sh qwen3-embedding-0.6b-8bit  # search by meaning
          \`\`\`

          each file is checked against a fixed SHA-256. the app itself never goes online.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
            # a run that failed mid-upload leaves a draft; publish it now
            gh release edit "$TAG" --draft=false
          else
            PRERELEASE=()
            [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease)
            gh release create "$TAG" "$DMG" "$DMG.sha256" --verify-tag --title "tällmi $VERSION" \
              --notes-file notes.md --generate-notes ${PRERELEASE[@]+"${PRERELEASE[@]}"}
          fi

      - name: remove signing keychain
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
